# Tên của workflow
name: Deploy React App to GitHub Pages

on:
  # Kích hoạt khi có 'push' lên nhánh 'main'
  push:
    branches: ["main"]
  # Cho phép bạn chạy thủ công từ tab Actions
  workflow_dispatch:

# Quyền hạn cho GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Cấu hình deploy
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Cài đặt Node.js (THÊM BƯỚC NÀY)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18 # Phiên bản Node.js

      # THÊM BƯỚC NÀY: Xóa cache cũ (để đảm bảo build mới)
      - name: Clean install directories
        run: |
          rm -rf node_modules
          rm -rf dist

      # 3. Cài đặt các thư viện (dependencies) (THÊM BƯỚC NÀY)
      - name: Install dependencies
        run: npm install # Hoặc 'npm ci' nếu bạn có package-lock.json

      # 4. Build dự án React (THÊM BƯỚC NÀY)
      - name: Build React App (Vite)
        run: npm run build # Lệnh này sẽ tạo ra thư mục 'dist'
        # === THÊM BƯỚC NÀY ĐỂ XEM KẾT QUẢ BUILD ===
      - name: Check built index.html
        run: cat dist/index.html

      # 5. Cấu hình cho GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Tải thư mục 'dist' lên làm artifact (SỬA LẠI PATH)
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Tải thư mục 'dist' (kết quả của npm run build)
          path: "./dist" # Sửa từ '.' thành './dist'

      # 7. Deploy lên GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
